<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Financiero</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_v) }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="top">
      <h1>Dashboard Financiero Web</h1>
      <div class="row wrap">
        <input id="excelPath" type="text" />
        <input id="excelFile" type="file" accept=".xlsx,.xls" class="short-file" />
        <button id="uploadBtn">Subir Excel</button>
        <a href="{{ url_for('static', filename='plantilla_financiera.xlsx') }}" download class="btn-download">
          <button type="button">Descargar Plantilla</button>
        </a>
        <a href="/cliente" target="_blank" class="btn-client">
          <button type="button">Abrir Formulario Cliente</button>
        </a>
        <a href="{{ url_for('static', filename='formulario_cliente.html') }}" download class="btn-client-dl">
          <button type="button">Descargar HTML Formulario</button>
        </a>
        <button id="discoverBtn">Detectar hojas</button>
        <select id="balanceSheet"></select>
        <select id="erSheet"></select>
        <button id="loadBtn">Cargar</button>
        <button id="reportBtn">Generar reporte</button>
      </div>
      <div class="row wrap">
        <label>Balance cuenta:</label><select id="balAccount" class="short"></select>
        <label>Balance años (coma):</label><input id="balYearsCols" type="text" placeholder="2024,2023,2022" />
      </div>
      <div class="row wrap">
        <label>E.R. cuenta:</label><select id="erAccount" class="short"></select>
        <label>E.R. años (coma):</label><input id="erYearsCols" type="text" placeholder="2024,2023,2022" />
      </div>
      <p id="status"></p>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Ratios</h2>
        <div class="row">
          <select id="ratioSelect"></select>
          <button id="ratioBtn">Actualizar</button>
        </div>
        <canvas id="ratioChart"></canvas>
      </section>

      <section class="card">
        <h2>Vertical Balance</h2>
        <div class="row">
          <select id="yearBalSelect"></select>
          <button id="balBtn">Ver</button>
        </div>
        <canvas id="balChart"></canvas>
      </section>

      <section class="card">
        <h2>Vertical E.R.</h2>
        <div class="row">
          <select id="yearErSelect"></select>
          <button id="erBtn">Ver</button>
        </div>
        <canvas id="erChart"></canvas>
      </section>

      <section class="card">
        <h2>Heatmap (tabla)</h2>
        <div class="row">
          <label>Lag:</label>
          <input id="lag" type="number" min="0" max="2" value="0" />
          <button id="heatBtn">Generar</button>
        </div>
        <div id="heatTable"></div>
        <p id="heatNote" class="hint"></p>
      </section>

      <section class="card">
        <h2>Análisis Horizontal - Balance</h2>
        <div id="horizontalBalanceTable" class="table-wrap"></div>
      </section>

      <section class="card">
        <h2>Análisis Horizontal - E.R.</h2>
        <div id="horizontalErTable" class="table-wrap"></div>
      </section>

      <section class="card">
        <h2>Factores Externos (WDI)</h2>
        <div class="row wrap">
          <label for="country">País ISO3</label>
          <input id="country" type="text" value="DOM" class="short" />
          <button id="wdiBtn">Actualizar WDI</button>
        </div>
        <p class="hint">Incluye Inflación, PIB real y <strong>USD/DOP</strong> (tasa del dólar).</p>
        <div class="row wrap">
          <input id="extYear" type="number" placeholder="Año" class="short" />
          <input id="extFx" type="number" step="0.0001" placeholder="USD/DOP" class="short" />
          <input id="extInf" type="number" step="0.01" placeholder="Inflación %" class="short" />
          <input id="extGdp" type="number" step="0.01" placeholder="PIB real %" class="short" />
          <input id="extTpm" type="number" step="0.01" placeholder="TPM %" class="short" />
          <button id="saveExternalBtn">Guardar dato manual</button>
        </div>
        <canvas id="fxRateChart"></canvas>
        <div id="externalTable" class="table-wrap"></div>
      </section>

      <section class="card">
        <h2>Índice PESTEL</h2>
        <div class="row wrap">
          <label for="pestelYear">Año</label>
          <select id="pestelYear" class="short"></select>
          <label><input id="autoEcon" type="checkbox" checked /> Auto Económico</label>
        </div>
        <div class="row wrap">
          <label>Econ:</label><input id="econW" type="number" value="25" class="short" />
          <label>Soc:</label><input id="socW" type="number" value="10" class="short" />
          <label>Geo:</label><input id="geoW" type="number" value="5" class="short" />
          <label>Pol:</label><input id="polW" type="number" value="25" class="short" />
          <label>Tec:</label><input id="tecW" type="number" value="25" class="short" />
          <label>Cul:</label><input id="culW" type="number" value="10" class="short" />
        </div>
        <div class="row wrap">
          <label>Econ manual:</label><input id="econManual" type="number" value="0" class="short" />
          <label>Soc:</label><input id="socRes" type="number" value="0" class="short" />
          <label>Geo:</label><input id="geoRes" type="number" value="0" class="short" />
          <label>Pol:</label><input id="polRes" type="number" value="0" class="short" />
          <label>Tec:</label><input id="tecRes" type="number" value="0" class="short" />
          <label>Cul:</label><input id="culRes" type="number" value="0" class="short" />
          <button id="pestelBtn">Calcular</button>
        </div>
        <p id="pestelStatus"></p>
        <canvas id="pestelChart"></canvas>
        <div id="pestelTable" class="table-wrap"></div>
      </section>

      <section class="card">
        <h2>Impacto Tasa de Cambio (Escenarios)</h2>
        <div class="row wrap">
          <label>KPI:</label>
          <select id="fxKpi" class="short"></select>
          <label>Shock USD/DOP %:</label>
          <input id="fxShock" type="number" value="10" class="short" />
          <label>Años proyección:</label>
          <input id="fxYears" type="number" value="3" min="1" max="10" class="short" />
          <button id="fxBtn">Correr escenarios</button>
        </div>
        <p id="fxMeta" class="hint"></p>
        <canvas id="fxChart"></canvas>
      </section>
    </main>

    <section class="card full">
      <h2>Tabla de Ratios</h2>
      <div id="ratiosTable" class="table-wrap"></div>
    </section>

    <script src="{{ url_for('static', filename='app.js', v=asset_v) }}"></script>
  </body>
</html>
